services:
  skemat:
    build:
      context: .
      dockerfile: Dockerfile
    image: skemat:latest
    container_name: skemat-saas
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://skemat.online,https://app.skemat.online}
      - FRONTEND_URL=${FRONTEND_URL:-https://skemat.online}
      - DATABASE_PATH=/app/server/data/skemat.sqlite
      # Paddle Billing v2 (paddle.com)
      - BILLING_PROVIDER=${BILLING_PROVIDER:-paddle}
      - PADDLE_ENV=${PADDLE_ENV:-production}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN:-}
      - PADDLE_WEBHOOK_SECRET_KEY=${PADDLE_WEBHOOK_SECRET_KEY:-}
      - PADDLE_PRO_MONTHLY_PRICE_ID=${PADDLE_PRO_MONTHLY_PRICE_ID:-}
      - PADDLE_PRO_YEARLY_PRICE_ID=${PADDLE_PRO_YEARLY_PRICE_ID:-}
      - PADDLE_TEAM_MONTHLY_PRICE_ID=${PADDLE_TEAM_MONTHLY_PRICE_ID:-}
      - PADDLE_TEAM_YEARLY_PRICE_ID=${PADDLE_TEAM_YEARLY_PRICE_ID:-}
      - PADDLE_PRO_MONTHLY_URL=${PADDLE_PRO_MONTHLY_URL:-}
      - PADDLE_PRO_YEARLY_URL=${PADDLE_PRO_YEARLY_URL:-}
      - PADDLE_TEAM_MONTHLY_URL=${PADDLE_TEAM_MONTHLY_URL:-}
      - PADDLE_TEAM_YEARLY_URL=${PADDLE_TEAM_YEARLY_URL:-}
      # Server-Managed AI (OpenRouter / Gemini / Groq / OpenAI)
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ALLOW_USER_LLM_CONFIG=${ALLOW_USER_LLM_CONFIG:-true}
    volumes:
      - skemat_data:/app/server/data

volumes:
  skemat_data:
    driver: local
